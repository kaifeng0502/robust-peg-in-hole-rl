name: Unit tests

on:
  push:
  pull_request:

jobs:
  controller-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q local_insertion scripts tests
      - name: Run controller-math tests
        run: python -m unittest discover -s tests -v
