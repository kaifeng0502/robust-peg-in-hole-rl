params:
  seed: 42
  algo:
    name: a2c_continuous
  env:
    clip_actions: 1.0
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: default}
        sigma_init: {name: const_initializer, val: -0.5}
        fixed_sigma: false
    mlp:
      units: [256, 256, 128]
      activation: elu
      d2rl: false
      initializer: {name: default}
      regularizer: {name: None}
  load_checkpoint: false
  load_path: ""
  config:
    name: LocalInsertion
    device: cuda:0
    env_name: rlgpu
    multi_gpu: false
    ppo: true
    mixed_precision: true
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: 128
    reward_shaper: {scale_value: 1.0}
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 1000000000.0
    max_epochs: 600
    save_best_after: 5
    save_frequency: 5
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 2048
    mini_epochs: 4
    critic_coef: 2
    clip_value: true
    bounds_loss_coef: 0.0001
    player:
      deterministic: true
